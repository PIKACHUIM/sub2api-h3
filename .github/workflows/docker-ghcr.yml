name: Build & Push Image (GHCR)

# 推送到 main 或打 tag 时：先做后端编译/单测校验，再构建镜像推到 GHCR。
# 镜像地址：ghcr.io/<owner>/<repo>:<tag>

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: '目标平台（逗号分隔，arm64 走 QEMU 会明显变慢）'
        required: false
        default: 'linux/amd64'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) 先验一遍 Go 侧能不能编译、MiniMax 媒体的单测过不过
  #    比直接进 Docker（要编前端）快很多，失败时反馈更及时
  # ---------------------------------------------------------------------------
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go build
        working-directory: backend
        run: go build ./...

      - name: go test (MiniMax media)
        working-directory: backend
        run: |
          go test ./internal/pkg/minimax/... ./internal/service/ -run 'MiniMax|Media' -count=1

  # ---------------------------------------------------------------------------
  # 2) 构建并推送镜像
  # ---------------------------------------------------------------------------
  image:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build args
        id: args
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Platforms
        id: platforms
        run: |
          P="${{ inputs.platforms }}"
          if [ -z "$P" ]; then P="linux/amd64"; fi
          echo "value=${P}" >> "$GITHUB_OUTPUT"
          if [[ "$P" == *arm64* ]]; then echo "arm64=true" >> "$GITHUB_OUTPUT"; else echo "arm64=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up QEMU
        if: steps.platforms.outputs.arm64 == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=h3,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=sub2api-h3
            org.opencontainers.image.description=Sub2API with MiniMax H3 media support (upstream PR #8446 merged)
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.args.outputs.version }}
            COMMIT=${{ steps.args.outputs.commit }}
            DATE=${{ steps.args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送 :rocket:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "- 版本：\`${{ steps.args.outputs.version }}\`"
            echo "- 提交：\`${{ steps.args.outputs.commit }}\`"
            echo "- 平台：\`${{ steps.platforms.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
